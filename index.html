<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team</title>
<style>
  :root {
    --ink: #222;
    --ink-soft: #666;
    --border: #e5e5e5;
    --bg: #fafafa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  header {
    padding: 48px 24px 24px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
  }

  #members {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .member-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Team</h1>
  <p>팀원 소개 페이지</p>
</header>

<main>
  <section id="members">
    <!-- TODO: members/ 폴더의 각 팀원 자기소개 내용을 카드로 채워넣기 -->
  </section>
</main>

</body>
</html>
